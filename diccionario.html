<!-- ══════════════════════════════════════════════════════════════════
     MES 11 · 10 de marzo de 2027 — Diccionario Privado

     LOS TEXTOS
     Están en js/diccionario.js, en el array PALABRAS. Sólo hay una
     entrada de ejemplo a propósito: bórrala en cuanto tengas la primera
     palabra real y copia el mismo formato para las siguientes.
     ══════════════════════════════════════════════════════════════════ -->

<body class="tema-diccionario">
    <a href="index.html" class="back-btn">⬅ Volver al Menú</a>

    <div class="petals-wrap" id="petals"></div>

    <section class="dc-hero">
        <span class="dc-ceja reveal-up">Mes 11 · 10 de marzo de 2027</span>
        <h1 class="dc-titulo reveal-up">Diccionario Privado</h1>
        <p class="dc-sub reveal-up">
            Toda pareja que dura acaba inventando un idioma propio. Casi
            nadie lo escribe. Aquí están las palabras que sólo significan
            algo entre nosotros dos.
        </p>
    </section>

    <section class="dc-envoltorio" aria-label="Diccionario con buscador">
        <div class="dc-buscador-fila">
            <input type="search" class="dc-buscador" id="dcBuscador"
                placeholder="Busca una palabra…" aria-label="Buscar en el diccionario">
        </div>
        <p class="dc-contador" id="dcContador"></p>
        <ul class="dc-lista" id="dcLista"></ul>
        <p class="dc-vacio" id="dcVacio" hidden></p>
        <p class="dc-digito" id="dcDigito" hidden>Para La Bóveda — mes 11: <strong>3</strong></p>
    </section>

    <footer>
        <p>Mes a mes, un poco más cerca.</p>
    </footer>

    <script src="js/fx-engine.js"></script>
    <script src="js/ambiente.js"></script>
    <script src="js/common.js"></script>
    <script src="js/diccionario.js"></script>
    <script src="js/fx-init.js"></script>
</body>

</html>
