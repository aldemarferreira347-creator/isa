  <!-- ═══════ Capas de ambiente (colinas + luciérnagas y pétalos) ═══════ -->
  <div id="colinas" aria-hidden="true">
    <svg viewBox="0 0 1440 240" preserveAspectRatio="none">
      <path d="M0 140 C240 80 420 180 720 140 C1020 100 1200 180 1440 120 L1440 240 L0 240 Z" fill="rgba(96,138,92,0.38)"/>
      <path d="M0 190 C300 140 560 220 860 180 C1160 140 1300 210 1440 180 L1440 240 L0 240 Z" fill="rgba(58,96,66,0.5)"/>
    </svg>
  </div>
  <canvas id="ambiente" aria-hidden="true"></canvas>

  <button id="btn-audio" aria-label="Activar o pausar sonido" title="Sonido">🔇</button>

  <main id="app">

    <!-- ══════════ 1 · BIENVENIDA ══════════ -->
    <section id="pantalla-inicio" class="pantalla activa">
      <div class="escena-inicio">
        <p class="eyebrow entrada-1">Primero de Agosto</p>
        <h1 id="titulo-inicio" class="titulo-heroe entrada-2"></h1>
        <div class="divisor entrada-3" aria-hidden="true">
          <span class="divisor-linea"></span>
          <svg class="divisor-flor"><use href="#f-rosa"/></svg>
          <span class="divisor-linea"></span>
        </div>
        <p id="subtitulo-inicio" class="texto-heroe entrada-3"></p>
        <button id="btn-iniciar" class="btn btn-principal entrada-4"></button>
        <p class="pista entrada-4">Sube el volumen y déjate llevar ✦</p>
      </div>
    </section>

    <!-- ══════════ 2 · TU JARDÍN ══════════ -->
    <section id="pantalla-jardin" class="pantalla">
      <header class="jardin-cabecera vidrio">
        <h2 id="jardin-titulo"></h2>
        <p id="jardin-instruccion" class="texto-suave"></p>
        <p id="jardin-progreso"></p>
      </header>
      <div id="jardin-zona">
        <div class="sol-jardin" aria-hidden="true"></div>
        <div id="jardin-plantas"></div>

        <!-- Cubo de malas hierbas (destino del arrastre) -->
        <div id="cubo" class="herramienta-fija oculto" aria-label="Cubo para botar las hierbas">
          <svg><use href="#f-cubo"/></svg>
          <span id="cubo-cuenta">0</span>
        </div>

        <!-- Regadera arrastrable (fase 1) -->
        <div id="regadera" class="herramienta oculto" role="button" tabindex="0"
             aria-label="Regadera: arrástrala sobre las flores marchitas para regarlas">
          <svg><use href="#f-regadera"/></svg>
        </div>

        <!-- Guante arrastrable (fase 2) -->
        <div id="guante" class="herramienta oculto" role="button" tabindex="0"
             aria-label="Guante: arrástralo hasta una hierba para arrancarla y llévala al cubo">
          <svg><use href="#f-guante"/></svg>
        </div>
      </div>
      <button id="btn-cosechar" class="btn btn-principal oculto"></button>
    </section>

    <!-- ══════════ 3 · COSECHANDO EL RAMO ══════════ -->
    <section id="pantalla-juego" class="pantalla">
      <header id="hud">
        <div id="hud-vidas" class="vidrio-chip" aria-label="Vidas"></div>
        <div id="hud-contador" class="vidrio-chip" aria-label="Flores cosechadas"></div>
      </header>

      <div id="ramo-barra" aria-label="Tu ramo"></div>

      <div id="canvas-wrap">
        <canvas id="lienzo"></canvas>

        <div id="overlay-instrucciones" class="overlay">
          <div class="tarjeta tarjeta-mini">
            <h2>Cosechando el Ramo</h2>
            <p id="texto-instrucciones" class="texto-suave"></p>
            <p class="texto-suave nota-control"><strong>Móvil:</strong> arrastra el dedo · <strong>PC:</strong> flechas ◀ ▶</p>
            <button id="btn-jugar" class="btn btn-principal">¡A cosechar!</button>
          </div>
        </div>

        <div id="overlay-derrota" class="overlay oculto">
          <div class="tarjeta tarjeta-mini">
            <svg class="icono-overlay"><use href="#f-marchita"/></svg>
            <p id="texto-derrota"></p>
            <button id="btn-reintentar" class="btn btn-principal">Intentar de nuevo</button>
          </div>
        </div>

        <div id="overlay-victoria" class="overlay oculto">
          <div class="tarjeta tarjeta-mini">
            <svg class="icono-overlay"><use href="#f-girasol"/></svg>
            <p>¡Ramo completo! Ahora... veamos cuánto sabes de nosotros 😏</p>
          </div>
        </div>

        <div id="aviso-flotante" class="oculto"></div>
      </div>

      <div id="controles-tactiles">
        <button id="btn-izq" class="btn-control" aria-label="Mover a la izquierda">◀</button>
        <button id="btn-der" class="btn-control" aria-label="Mover a la derecha">▶</button>
      </div>
    </section>

    <!-- ══════════ 4 · NUESTRA HISTORIA ══════════ -->
    <section id="pantalla-trivia" class="pantalla">
      <div class="tarjeta tarjeta-trivia">
        <p class="eyebrow">Nuestra Historia</p>
        <div id="trivia-progreso" aria-label="Progreso de la trivia"></div>
        <h2 id="trivia-pregunta"></h2>
        <div id="trivia-opciones"></div>
        <p id="trivia-feedback" aria-live="polite"></p>
      </div>
    </section>

    <!-- ══════════ 5 · LA FLOR DORADA ══════════ -->
    <section id="pantalla-final" class="pantalla">
      <canvas id="petalos" aria-hidden="true"></canvas>
      <div class="contenido-final">

        <h1 id="titulo-final" class="titulo-heroe"></h1>

        <div id="flor-dorada" aria-label="La Flor Dorada">
          <div class="halo" aria-hidden="true"></div>
          <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">

                <stop offset="0%" stop-color="#C8951B"/>

            <g id="rayos" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" opacity="0.5">

            <g id="petalos-svg">
              <ellipse cx="110" cy="58" rx="24" ry="46" fill="url(#petaloOro)" transform="rotate(0 110 110)"/>

            </g>
            <g id="petalos-svg-2">
              <ellipse cx="110" cy="74" rx="16" ry="32" fill="url(#petaloOro2)" transform="rotate(22.5 110 110)"/>

              <ellipse cx="110" cy="74" rx="16" ry="32" fill="url(#petaloOro2)" transform="rotate(292.5 110 110)"/>
              <ellipse cx="110" cy="74" rx="16" ry="32" fill="url(#petaloOro2)" transform="rotate(337.5 110 110)"/>
            </g>
            <circle cx="110" cy="110" r="27" fill="url(#centroOro)"/>
            <circle cx="102" cy="101" r="6" fill="#FFF3B0" opacity="0.7"/>
            <circle cx="118" cy="116" r="3" fill="#FFE28A" opacity="0.5"/>
          </svg>
        </div>

        <p id="subtitulo-final" class="texto-heroe"></p>

        <div id="foto-final" class="oculto">
          <img id="foto-img" alt="Nosotros 💕">
        </div>

        <div id="cupon">
